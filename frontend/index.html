<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="India-focused solar rooftop and ground site analysis." />
    <meta name="theme-color" content="#0f1b2a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Surya-Ghar · Solar Rooftop Analysis</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply the persisted/OS theme before React mounts to avoid a flash of
      // the wrong theme. Mirrors useTheme's resolveInitialTheme().
      try {
        var storedTheme = localStorage.getItem("suryaghar-theme");
        if (storedTheme !== "light" && storedTheme !== "dark") {
          storedTheme =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        document.documentElement.dataset.theme = storedTheme;
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
